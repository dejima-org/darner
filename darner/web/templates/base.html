<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{% block title %}darner{% endblock %}</title>
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body data-now="{{ now }}"{% if state %} data-state="{{ state }}" data-version="{{ version }}"{% endif %}{% if drafts %} data-drafts{% endif %}>
<header>
<nav aria-label="darner">
<a href="/" class="brand"><img src="/static/{{ wordmark }}-wordmark-darkmode.png" alt="{{ wordmark }}" width="106" height="26"></a>
<span class="links">
<a href="/">Sessions</a>
<a href="/blurbs">Blurbs</a>
<a href="/configs">Config sets</a>
<a href="/selftest">Self-test</a>
</span>
<a href="/new" class="button new">New<span class="wide"> task</span></a>
</nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
