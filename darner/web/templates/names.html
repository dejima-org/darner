{% extends "base.html" %}
{% block main %}
<h1>{{ title }}</h1>
{% if names %}
<ul class="names">
{% for name in names %}<li><a href="/{{ kind }}/{{ name | urlencode }}">{{ name }}</a>{% if descriptions.get(name) %} <span class="description">{{ descriptions[name] }}</span>{% endif %}</li>{% endfor %}
</ul>
{% else %}
<p class="lead">None.</p>
{% endif %}
{% endblock %}
