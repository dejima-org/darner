# Runs the test suite on every pull request, and builds the API's image.
#
# pull_request, not pull_request_target: the workflow is read from the head
# branch, so a branch could point these jobs at another runner. That was the
# case pull_request_target was meant to close, but dejima/dejima#384 showed it
# reads the workflow from a base branch the pull request's author chooses,
# so it bounds that less than it appears to, and pull_request is the simpler of
# the two.
#
# Split by what each job needs: the tests run anywhere Python does, so on the
# confined tier; building the image needs a Docker daemon, so the privileged
# one.
name: tests

on:
  pull_request:

jobs:
  confined:
    runs-on: dejima-confined
    name: confined (pytest)
    container:
      image: node:20-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # by digest, as the Dockerfile's base
    steps:
      - name: Install Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv ca-certificates

      - uses: actions/checkout@v4

      # For tests/test_dejima.py: the dejima release the newest changelog entry
      # names, or dejima's development while it names none.
      - name: Fetch dejima
        run: |
          ref="$(sed -n 's/^Released against dejima: *//p' CHANGELOG.md | head -n 1)"
          if [ -z "$ref" ] || [ "$ref" = N/A ]; then ref=development; fi
          git clone --quiet --depth 1 --branch "$ref" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY_OWNER/dejima.git" /tmp/dejima

      # As an unprivileged user, since root ignores file permissions and the
      # tests that check unreadable files would skip. Dependencies come from
      # requirements/test.txt, pinned with hashes.
      - name: Run the tests
        run: |
          chown -R node:node .
          su node -c "python3 -m venv .venv \
            && .venv/bin/pip install --quiet --require-hashes -r requirements/test.txt \
            && .venv/bin/pip install --quiet --no-deps --no-build-isolation -e . \
            && DEJIMA_SRC=/tmp/dejima .venv/bin/python -m pytest -q"

  privileged:
    runs-on: dejima-privileged
    name: privileged (images)
    container:
      image: node:20-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # by digest, as the Dockerfile's base
    env:
      DOCKER_CLI_VERSION: 27.5.1
      IMAGE: darner-api-ci-${{ github.run_id }}
      WEB_IMAGE: darner-web-ci-${{ github.run_id }}
    steps:
      - name: Install the Docker CLI
        run: |
          curl -fsSL "https://download.docker.com/linux/static/stable/$(uname -m)/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar -xzC /usr/local/bin --strip-components=1 docker/docker
          docker info >/dev/null

      - uses: actions/checkout@v4

      - name: Build the images
        run: |
          docker build -t "$IMAGE" .
          docker build -t "$WEB_IMAGE" -f Dockerfile.web .

      - name: Check the image runs as uid and gid 10001 and starts the API
        run: |
          [ "$(docker run --rm --entrypoint id "$IMAGE")" = "uid=10001(darner) gid=10001(darner) groups=10001(darner)" ]
          docker run --rm "$IMAGE" --help

      - name: Check the web image runs as uid and gid 10001 and starts darner-web
        run: |
          [ "$(docker run --rm --entrypoint id "$WEB_IMAGE")" = "uid=10001(darner) gid=10001(darner) groups=10001(darner)" ]
          docker run --rm "$WEB_IMAGE" --help

      - name: Remove the image
        if: always()
        run: docker rmi -f "$IMAGE" "$WEB_IMAGE" || true
