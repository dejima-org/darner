listen = "127.0.0.1:8080"
db_path = "/var/lib/meeseeks/tasks.db"
blurbs_dir = "/etc/meeseeks/blurbs"
# Blurbs added to every task, such as how the network reaches internal services.
# default_blurbs = ["network"]
results_dir = "/var/lib/meeseeks/results"
poll_interval = 30
launch_command = ["ssh", "-T", "-o", "BatchMode=yes", "operator@dejima.example.com"]
launch_timeout = 120

# dejima's web remote access base_url, to link sessions from chat.
# remote_access_url = "https://dejima.example.com"

# One token per source; the bot instance uses one of these as api_token.
[tokens]
maubot = "replace-with-a-long-random-token"

[policy]
deny_domains = []
max_domains = 20

# Should match the launcher's --max-output; a smaller value rejects output the launcher collected.
[limits]
max_bytes = 52428800
max_files = 1000
