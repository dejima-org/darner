# nginx in front of darner-web, with HTTP Basic. This won't load as written:
# replace every REPLACE_ before `nginx -t` passes. docs/web.md explains each
# choice, and the other ways to authenticate.

# Anything that doesn't name darner-web's host gets no TLS handshake at all.
server {
    listen REPLACE_LAN_ADDRESS:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    # One specific address: never a bare `listen 443`, 0.0.0.0, or a Docker
    # bridge, which a sandbox can reach.
    listen REPLACE_LAN_ADDRESS:443 ssl;
    # Its own hostname. Never a path on the host serving dejima's remote access.
    server_name REPLACE_DARNER_WEB_HOSTNAME;

    ssl_certificate     REPLACE_CERTIFICATE_PATH;
    ssl_certificate_key REPLACE_CERTIFICATE_KEY_PATH;

    # Authentication and authorization: only the users listed in this file.
    auth_basic "darner";
    auth_basic_user_file REPLACE_HTPASSWD_PATH;

    location / {
        proxy_pass http://127.0.0.1:8081;
        # $http_host, not $host: darner-web checks the port too.
        proxy_set_header Host $http_host;
        # Set from the authenticated user, replacing anything a client sent.
        # web.toml: user_header = "X-Remote-User"
        proxy_set_header X-Remote-User $remote_user;
        client_max_body_size 64m;
    }
}
