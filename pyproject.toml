[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "darner"
version = "0.1.18"
description = "Start dejima sessions from task requests"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.optional-dependencies]
api = ["aiohttp>=3.9"]
test = ["aiohttp>=3.9", "pytest", "pytest-aiohttp", "maubot"]

[project.scripts]
darner-api = "darner.api:main"
darner-launch = "darner.launch:main"

[tool.setuptools]
packages = ["darner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "plugin"]
