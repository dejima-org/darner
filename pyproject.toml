[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "darner"
version = "0.1.19"
description = "Start dejima sessions from task requests"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.optional-dependencies]
api = ["aiohttp>=3.9"]
web = ["aiohttp>=3.9", "jinja2>=3.1", "markdown-it-py>=3"]
test = ["aiohttp>=3.9", "pytest", "pytest-aiohttp", "maubot", "jinja2>=3.1", "markdown-it-py>=3"]

[project.scripts]
darner-api = "darner.api:main"
darner-launch = "darner.launch:main"
darner-web = "darner.web:main"

[tool.setuptools]
packages = ["darner", "darner.web"]

[tool.setuptools.package-data]
"darner.web" = ["templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "plugin"]
